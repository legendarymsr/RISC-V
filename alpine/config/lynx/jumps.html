<!-- lynx jump shortcuts. Installed to /etc/lynx-jumps.html by setup.sh
     (lynx wants an absolute path, no ~). Press s, then a shortcut;
     %s makes lynx ask for the search text. s then ? lists them all. -->
<html><head><title>lynx shortcuts</title></head>
<body>
<dl compact>
<dt>?<dd><a href="file://localhost/etc/lynx-jumps.html">This shortcut list</a>
<dt>d<dd><a href="https://lite.duckduckgo.com/lite/?q=%s">DuckDuckGo Lite search</a>
<dt>ddg<dd><a href="https://lite.duckduckgo.com/lite/?q=%s">DuckDuckGo Lite search</a>
<dt>dh<dd><a href="https://lite.duckduckgo.com/lite/">DuckDuckGo Lite home</a>
</dl>
</body></html>
