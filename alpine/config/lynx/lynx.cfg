# ~/.config/lynx/lynx.cfg — lynx, riced: Tokyo Night colours + vi keys.
# Picked up via $LYNX_CFG (set in config/profile). LYNX_CFG *replaces* the
# system file, so pull the distro defaults in first and override below.
# Checked against Alpine's lynx 2.9.3 (color-style + default-colors build).
INCLUDE:/etc/lynx.cfg
# (Debian/Fedora keep it here; a missing INCLUDE is silently skipped)
INCLUDE:/etc/lynx/lynx.cfg

# ── look ──────────────────────────────────────────────────────────────────────
# Colours live in lynx.lss ($LYNX_LSS). Use the terminal's own fg/bg
# (#c0caf5 on #1a1b26 from ~/.Xresources) wherever the stylesheet says "default".
DEFAULT_COLORS:TRUE
SHOW_CURSOR:TRUE
UNDERLINE_LINKS:FALSE
BOLD_HEADERS:FALSE
UPDATE_TERM_TITLE:TRUE
# show the link's URL in the status line
DEFAULT_USER_MODE:ADVANCED

# Fallback palette if the stylesheet is ever disabled (-lss= / LYNX_LSS="").
# COLOR:<slot>:fg:bg — 0 normal, 1 links, 2 status, 3 unused, 4 bold/em,
# 5 input, 6 current link, 7 search hit.
COLOR:0:default:default
COLOR:1:blue:default
COLOR:2:white:gray
COLOR:3:magenta:default
COLOR:4:yellow:default
COLOR:5:cyan:default
COLOR:6:black:blue
COLOR:7:black:yellow

# ── vi keys ───────────────────────────────────────────────────────────────────
# h back · j/k next/prev link · l follow   (built in)
VI_KEYS_ALWAYS_ON:TRUE
# g/G top/bottom of page (vim). That evicts goto, so: o = open URL,
# O = edit current URL and go (qutebrowser/vimium style). Options → c.
KEYMAP:g:HOME
KEYMAP:G:END
KEYMAP:o:GOTO
KEYMAP:O:ECGOTO
KEYMAP:c:OPTIONS
# ^D/^U half-page (stock ^D quits without asking, ^U was "forward")
KEYMAP:^D:DOWN_HALF
KEYMAP:^U:UP_HALF
# u back (stock), U forward
KEYMAP:U:NEXT_DOC
# H back too (help stays on ?)
KEYMAP:H:PREV_DOC
# / search, n/N next/prev hit are already stock.
# s = search shortcuts: s d <Enter> asks for a query and searches DuckDuckGo
# Lite (s ? lists every shortcut). j is taken by vi keys, so jumps live on s.
# lynx needs an absolute path here; setup.sh links the repo's jumps.html there.
JUMPFILE:/etc/lynx-jumps.html
JUMPFILE:/etc/lynx-jumps.html:s:Search (d=DuckDuckGo, ?=list):
# Don't let j/k get typed into a form field you land on — press Enter to edit.
TEXTFIELDS_NEED_ACTIVATION:TRUE

# ── sane defaults ────────────────────────────────────────────────────────────
STARTFILE:https://lite.duckduckgo.com/lite/
CHARACTER_SET:utf-8
ASSUME_CHARSET:utf-8
PREFERRED_CHARSET:utf-8
# take cookies without nagging, but keep them in RAM only
SET_COOKIES:TRUE
ACCEPT_ALL_COOKIES:TRUE
PERSISTENT_COOKIES:FALSE
FORCE_SSL_COOKIES_SECURE:TRUE
QUIT_DEFAULT_YES:TRUE
NO_PAUSE:TRUE
DEFAULT_EDITOR:vis
